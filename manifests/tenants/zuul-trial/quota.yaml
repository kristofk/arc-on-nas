# The namespace's budget (README, "Tenant namespaces", for the arithmetic). Requests are what the
# scheduler admits against the node's allocatable, so they are kept small enough to fit beside
# the runners at their peak; limits are what a pod may use when memory is free, and the k3s
# container's own cap bounds them all. Every container gets a memory and an ephemeral-storage
# limit from the LimitRange below when it names none.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
spec:
  hard:
    requests.cpu: "1500m"
    # CPU limits only throttle; the k3s container's CPU cap and weight are what protect the host.
    limits.cpu: "16"
    requests.memory: 2Gi
    # 7 GiB, not 6: the trial's pods hold about 5.25 GiB of limits, and a rolling update
    # starts a pod's replacement (1.5 GiB for the executor) before the old one goes.
    limits.memory: 7Gi
    # Disk on the node: emptyDir volumes, the containers' writable layers and their logs, which
    # the kubelet adds up per pod and evicts the pod for when they pass its containers' limits
    # (README, "Tenant namespaces", "Disk"). The runners' work folders share the filesystem.
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 4Gi
    pods: "20"
    services: "10"
    # A NodePort answers on every address of the node, outside the namespace's NetworkPolicies;
    # there is no load balancer.
    services.nodeports: "0"
    services.loadbalancers: "0"
    configmaps: "50"
    # Every object is a row in k3s's datastore, which the runners need too: a bound on each kind.
    count/deployments.apps: "20"
    # Each Deployment keeps up to 10 old ReplicaSets by default.
    count/replicasets.apps: "250"
    count/statefulsets.apps: "10"
    count/daemonsets.apps: "5"
    count/jobs.batch: "50"
    count/cronjobs.batch: "10"
    count/horizontalpodautoscalers.autoscaling: "10"
    count/poddisruptionbudgets.policy: "10"
    count/leases.coordination.k8s.io: "20"
    count/serviceaccounts: "20"
    secrets: "50"
    persistentvolumeclaims: "5"
    # Every claim's requested size together, whatever binds it: a PersistentVolume made for this
    # namespace by hand (README, "Tenant namespaces") or local-path.
    requests.storage: 10Gi
    # local-path, k3s's default StorageClass, makes a directory on the node for each claim and
    # does not enforce its size: this counts requests, not bytes on disk.
    local-path.storageclass.storage.k8s.io/requests.storage: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 64Mi
      max:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 3Gi
