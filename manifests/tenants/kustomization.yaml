# Tenant namespaces: namespaces that a user other than the cluster admin deploys into, with a
# client certificate that reaches nothing else (README, "Tenant namespaces"). Apply with
#   docker compose exec k3s kubectl apply -k /opt/arc-on-nas/manifests/tenants
# Separate from ../kustomization.yaml: the runners do not need it, and removing it is
# `kubectl delete -k` of this directory alone.
#
# Each tenant is a directory: its namespace, quota and limits, plus base/ (the policies, then
# the Role and RoleBinding) with its namespace set by kustomize. admission.yaml holds what Pod
# Security "baseline" leaves open, for every namespace labelled as a tenant. example/ is one to
# copy, and is not listed; a tenant kept in another repository lists base/ by its commit and is
# applied from there (README, "Adding a tenant").
#
# Applied in the order listed (sortOptions fifo), so that the admission policies, the quotas and
# the NetworkPolicies exist before the RoleBinding gives the users anything.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
sortOptions:
  order: fifo
resources:
  - admission.yaml
  - zuul-trial
