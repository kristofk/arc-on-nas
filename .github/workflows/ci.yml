name: CI

# lint   every static check (scripts/lint.sh, with the tool versions in mise.toml).
# host   scripts/preflight.sh and scripts/trial.sh on a GitHub-hosted runner.
# smoke  the real stack on a GitHub-hosted runner: docker compose up, the node Ready, the
#        manifests applied, the credential Secret created by scripts/register.sh, the controller
#        chart installed through the proxy and running, the runner pod templates admitted by Pod
#        Security "restricted", the egress rules tested from a pod, and the tenant namespaces: their
#        permissions, admission's refusals and NET_RAW drops, the ephemeral-storage limits and an
#        eviction for passing one, tenant-cert.sh's refusals and a
#        certificate it signs used by kubectl with the kubeconfig it writes through
#        api-forward.yml, and the tenant NetworkPolicies against each target, with controls.
#
# What a hosted runner cannot show (README, "Status"): a scale set registering with GitHub and
# running a job (that needs a real credential and a repository to register with), the runner
# images (built by images.yml), the cache under a real build, and anything about your host's
# storage, kernel or sizing.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: scripts/lint.sh
        run: mise exec -- scripts/lint.sh

  host:
    name: Preflight and trial
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/preflight.sh
        run: scripts/preflight.sh
      - name: scripts/trial.sh
        run: scripts/trial.sh --timeout 240

  smoke:
    name: Smoke test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Above the sum of the waits below (about 28 minutes), so a slow day ends in a wait's own error
    # and the diagnostics; a normal run takes about 4 minutes.
    timeout-minutes: 32
    env:
      CHART_VERSION: "0.15.0"
      CHARTS: oci://ghcr.io/actions/actions-runner-controller-charts
      PROXY: http://172.31.250.2:3128
      GATEWAY: 172.31.250.1
      CURL_IMAGE: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
      BUSYBOX_IMAGE: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Directories and .env sized for this runner
        run: |
          set -euo pipefail
          sudo install -d -o 1001 -g 1001 -m 750 "$RUNNER_TEMP/ci-cache/default"
          sudo install -d -o 0 -g 0 -m 700 kubeconfig
          # Hosted runners have 2 CPUs and 8 GB (private repositories) or 4 and 16 (public). Size
          # as README "Sizing" does: allocatable 1500m CPU and 2560Mi, kube-reserved 250m and
          # 512Mi, the rest reserved for the "host"; caps a little above allocatable + kube-reserved.
          # k3s sets no memory eviction threshold, so nothing else is subtracted.
          cpus=$(nproc)
          mem=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) / 1024 ))
          cat > .env <<EOF
          CACHE_DIR=$RUNNER_TEMP/ci-cache
          K3S_CPUS=$cpus
          K3S_MEMORY=4g
          K3S_CPU_SHARES=256
          K3S_PIDS_LIMIT=32768
          K3S_SYSTEM_RESERVED=cpu=$(( cpus * 1000 - 1500 - 250 ))m,memory=$(( mem - 2560 - 512 ))Mi
          K3S_KUBE_RESERVED=cpu=250m,memory=512Mi
          K3S_SNAPSHOTTER=overlayfs
          K3S_EXTRA_ARGS=
          EOF
          cat .env

      - name: scripts/preflight.sh with the stack's settings
        run: scripts/preflight.sh

      - name: docker compose up
        run: docker compose up -d --wait --wait-timeout 180

      - name: The node is Ready
        run: |
          set -euo pipefail
          # The node object appears a few seconds after the API server answers.
          for _ in $(seq 1 30); do
            docker compose exec -T k3s kubectl get node ci-node >/dev/null 2>&1 && break
            sleep 2
          done
          # Ready needs the system pods' images, which containerd pulls through the proxy.
          docker compose exec -T k3s kubectl wait --for=condition=Ready node/ci-node --timeout=180s
          docker compose exec -T k3s kubectl get node ci-node -o wide
          fmt='capacity {.status.capacity.cpu} CPU {.status.capacity.memory}; '
          fmt+='allocatable {.status.allocatable.cpu} CPU {.status.allocatable.memory}{"\n"}'
          docker compose exec -T k3s kubectl get node ci-node -o jsonpath="$fmt"

      - name: Apply the manifests
        run: |
          set -euo pipefail
          docker compose exec -T k3s kubectl apply -k /opt/arc-on-nas/manifests
          for _ in $(seq 1 30); do
            phase=$(docker compose exec -T k3s kubectl -n arc-runners get pvc ci-cache -o jsonpath='{.status.phase}')
            [ "$phase" = Bound ] && break
            sleep 2
          done
          echo "ci-cache: $phase"
          test "$phase" = Bound

      - name: scripts/register.sh stores a credential
        run: |
          set -euo pipefail
          # A dummy value: nothing registers with GitHub in this test.
          printf 'not-a-real-token\n' > "$RUNNER_TEMP/token"
          scripts/register.sh --token-file "$RUNNER_TEMP/token"
          stored=$(docker compose exec -T k3s kubectl -n arc-runners get secret github-credentials \
            -o jsonpath='{.data.github_token}' | base64 -d)
          test "$stored" = not-a-real-token
          printf 'not-a-real-key\n' > "$RUNNER_TEMP/key.pem"
          scripts/register.sh --name app-test --app-id 1 --installation-id 2 --private-key-file "$RUNNER_TEMP/key.pem"
          keys=$(docker compose exec -T k3s kubectl -n arc-runners get secret app-test \
            -o go-template='{{range $k, $v := .data}}{{$k}} {{end}}')
          test "$keys" = "github_app_id github_app_installation_id github_app_private_key "
          docker compose exec -T k3s kubectl -n arc-runners delete secret app-test
          rm -f "$RUNNER_TEMP/token" "$RUNNER_TEMP/key.pem"
          echo "Both credential forms stored."

      - name: Install the controller chart with the helm service
        run: |
          set -euo pipefail
          docker compose run --rm -T helm upgrade --install arc \
            "$CHARTS/gha-runner-scale-set-controller" --version "$CHART_VERSION" \
            --namespace arc-systems -f helm/controller.yaml --wait --timeout 5m
          docker compose exec -T k3s kubectl -n arc-systems wait --for=condition=Ready pod \
            -l app.kubernetes.io/part-of=gha-rs-controller --timeout=120s
          docker compose exec -T k3s kubectl -n arc-systems get pods -o wide
          docker compose exec -T k3s kubectl get crd autoscalingrunnersets.actions.github.com

      - name: The controller pod meets Pod Security "restricted"
        run: |
          set -euo pipefail
          # A server-side dry run of enforcing "restricted" on arc-systems lists every existing pod
          # that would violate it, as warnings.
          out=$(docker compose exec -T k3s kubectl label --dry-run=server --overwrite namespace arc-systems \
            pod-security.kubernetes.io/enforce=restricted 2>&1)
          echo "$out"
          if echo "$out" | grep -qi warning; then exit 1; fi

      - name: The runner pod templates are admitted by Pod Security "restricted"
        run: |
          set -euo pipefail
          # The pods ARC would create from each scale set's template. Their service account comes
          # with the scale set's chart, which is not installed here: the default one stands in.
          for s in swift ubuntu browser; do
            docker compose run --rm -T helm template "$s" "$CHARTS/gha-runner-scale-set" \
              --version "$CHART_VERSION" --namespace arc-runners -f "helm/$s.yaml" \
              --set githubConfigUrl=https://github.com/OWNER/REPO > "$RUNNER_TEMP/$s.yaml"
            yq 'select(.kind == "AutoscalingRunnerSet") | {"apiVersion": "v1", "kind": "Pod",
                "metadata": {"name": "'"$s"'-runner", "namespace": "arc-runners"}, "spec": .spec.template.spec}
                | del(.spec.serviceAccountName)' "$RUNNER_TEMP/$s.yaml" > "$RUNNER_TEMP/$s-pod.yaml"
            docker compose exec -T k3s kubectl apply --dry-run=server -f - < "$RUNNER_TEMP/$s-pod.yaml"
          done
          # And a privileged pod is refused.
          overrides='{"spec":{"containers":[{"name":"privileged","image":"'"$CURL_IMAGE"'",'
          overrides+='"securityContext":{"privileged":true}}]}}'
          if docker compose exec -T k3s kubectl -n arc-runners run privileged --dry-run=server \
               --image="$CURL_IMAGE" --overrides="$overrides" 2> "$RUNNER_TEMP/refused.txt"; then
            echo "A privileged pod was admitted to arc-runners." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/refused.txt"
          grep -q 'violates PodSecurity "restricted' "$RUNNER_TEMP/refused.txt"

      - name: Egress from a runner-like pod
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          # A listener on the host, to show what the NetworkPolicy blocks.
          python3 -m http.server 18080 --bind 0.0.0.0 > /dev/null 2>&1 &
          # Restricted, uid 1001, the cache claim mounted: what a runner pod gets.
          k apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: egress-test
            namespace: arc-runners
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              seccompProfile: {type: RuntimeDefault}
            containers:
              - name: test
                image: $CURL_IMAGE
                command: ["sleep", "600"]
                resources:
                  requests: {cpu: 100m, memory: 64Mi}
                  limits: {cpu: 100m, memory: 64Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
                volumeMounts:
                  - {name: cache, mountPath: /home/runner/cache}
            volumes:
              - name: cache
                persistentVolumeClaim: {claimName: ci-cache}
          EOF
          k -n arc-runners wait --for=condition=Ready pod/egress-test --timeout=180s
          run() { k -n arc-runners exec egress-test -- "$@"; }
          code() { run curl -sS -o /dev/null -m 15 -w '%{http_code}' "$@" || true; }
          # For HTTPS through the proxy: the proxy's answer to CONNECT (http_code stays 000 when
          # the tunnel is refused, as it does when the proxy is down or the request times out).
          connect_code() { run curl -sS -o /dev/null -m 15 -w '%{http_connect}' "$@" || true; }

          run sh -c 'f=/home/runner/cache/smoke-test; echo ok > $f && cat $f && rm $f'
          echo "cache: writable as uid 1001"

          c=$(code -x "$PROXY" https://github.com/); echo "github.com through the proxy: $c"
          [ "$c" = 200 ]
          c=$(code -x "$PROXY" http://169.254.169.254/); echo "link-local through the proxy: $c"
          [ "$c" = 403 ]
          c=$(connect_code -x "$PROXY" https://10.43.0.1/); echo "a private address through the proxy: CONNECT $c"
          [ "$c" = 403 ]
          # curl's exit code 6 means the name did not resolve; anything else means DNS answered.
          rc=0; run curl -sk -o /dev/null -m 5 https://kubernetes.default.svc/version || rc=$?
          echo "cluster DNS: curl exit $rc"
          [ "$rc" != 6 ]
          c=$(code --noproxy '*' https://1.1.1.1/); echo "the internet without the proxy: $c"
          [ "$c" = 000 ]

          # The host's port through the stack network's gateway: open to a plain container on the
          # network (Docker's documented limit), closed to the pod (the NetworkPolicy).
          c=$(docker run --rm --network ci_runners "$CURL_IMAGE" \
                -sS -o /dev/null -m 10 -w '%{http_code}' "http://$GATEWAY:18080/" || true)
          echo "host port via the gateway, from a container on the network: $c"
          # The control: without it, the pod's failure below would prove nothing.
          [ "$c" = 200 ]
          c=$(code --noproxy '*' "http://$GATEWAY:18080/"); echo "host port via the gateway, from the pod: $c"
          [ "$c" = 000 ]
          k -n arc-runners delete pod egress-test --wait=false

      - name: The tenant namespaces
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          k apply -k /opt/arc-on-nas/manifests/tenants
          u=opifex-magnus
          # What the Role allows and refuses, asked as the user with the group of their certificate.
          can() { k auth can-i --as "$u" --as-group devinfra "$@" 2>/dev/null || true; }
          for q in "-n zuul-trial create pods" "-n zuul-trial create pods --subresource=exec" \
                   "-n build-farm create deployments.apps" "-n zuul-trial create secrets"; do
            # shellcheck disable=SC2086 # $q is the question's words
            a=$(can $q); echo "can $q: $a"; [ "$a" = yes ]
          done
          for q in "-n arc-runners list pods" "-n arc-systems get secrets" "list nodes" "list namespaces" \
                   "list persistentvolumes" "create persistentvolumes" "patch namespaces" \
                   "create certificatesigningrequests" \
                   "update certificatesigningrequests --subresource=approval" "-n zuul-trial create rolebindings" \
                   "-n zuul-trial create roles" "-n zuul-trial patch networkpolicies" \
                   "-n zuul-trial create endpoints" "-n zuul-trial create endpointslices.discovery.k8s.io" \
                   "-n zuul-trial create serviceaccounts --subresource=token" \
                   "-n zuul-trial update resourcequotas" "impersonate users" \
                   "-n zuul-trial update pods --subresource=ephemeralcontainers" \
                   "-n zuul-trial get pods --subresource=proxy" "-n zuul-trial get services --subresource=proxy" \
                   "-n zuul-trial update services --subresource=status" "get nodes --subresource=proxy"; do
            # shellcheck disable=SC2086 # $q is the question's words
            a=$(can $q); echo "can $q: $a"; [ "$a" = no ]
          done

          # The build farm's cache volume binds to its claim, and a claim in another tenant's namespace
          # that names it stays unbound (manifests/tenants/build-farm/cache-volume.yaml, claimRef).
          k -n build-farm wait --for=jsonpath='{.status.phase}'=Bound pvc/cache --timeout=60s
          b=$(k get pv build-farm-cache -o jsonpath='{.spec.claimRef.namespace}/{.spec.claimRef.name}')
          echo "build-farm-cache bound to $b"; [ "$b" = build-farm/cache ]
          k --as "$u" --as-group devinfra -n zuul-trial apply -f - <<< '{"apiVersion":"v1",
            "kind":"PersistentVolumeClaim","metadata":{"name":"other-cache"},"spec":{"accessModes":
            ["ReadWriteOnce"],"storageClassName":"","volumeName":"build-farm-cache",
            "resources":{"requests":{"storage":"1Gi"}}}}'
          if k -n zuul-trial wait --for=jsonpath='{.status.phase}'=Bound pvc/other-cache --timeout=15s; then
            echo "a zuul-trial claim got build-farm-cache" >&2; exit 1
          fi
          k -n zuul-trial delete pvc other-cache

          # What admission refuses: each must fail, with the reason in its message.
          refused() {
            local why=$1; shift
            if k --as "$u" --as-group devinfra -n zuul-trial "$@" --dry-run=server > /dev/null \
                 2> "$RUNNER_TEMP/refused.txt"; then
              echo "Admitted, but should be refused ($why): $*" >&2; exit 1
            fi
            grep -q "$why" "$RUNNER_TEMP/refused.txt" || { cat "$RUNNER_TEMP/refused.txt" >&2; exit 1; }
            echo "refused ($why): $(head -c 160 "$RUNNER_TEMP/refused.txt")"
          }
          # A pod as JSON: $1 is added to its spec, $2 to its container, $3 replaces the image.
          pod() {
            printf '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"t"},"spec":{%s' "$1"
            printf '"containers":[{"name":"t","image":"%s"%s}]}}' "${3:-$CURL_IMAGE}" "$2"
          }
          refused 'violates PodSecurity "baseline' apply -f - <<< "$(pod '' ',"securityContext":{"privileged":true}')"
          refused 'violates PodSecurity "baseline' apply -f - \
            <<< "$(pod '"volumes":[{"name":"h","hostPath":{"path":"/"}}],' '')"
          refused 'violates PodSecurity "baseline' apply -f - <<< "$(pod '"hostNetwork":true,' '')"
          refused 'violates PodSecurity "baseline' apply -f - \
            <<< "$(pod '' ',"securityContext":{"capabilities":{"add":["NET_RAW"]}}')"
          refused 'tenant namespaces allow only these volume types' apply -f - \
            <<< "$(pod '"volumes":[{"name":"n","nfs":{"server":"'"$GATEWAY"'","path":"/"}}],' '')"
          refused 'tenant namespaces pull images only from registries on the internet' apply -f - \
            <<< "$(pod '' '' registry-scratch.arc-scratch.svc:5000/x:1)"
          refused 'tenant namespaces pull images only from registries on the internet' apply -f - \
            <<< "$(pod '' '' "$GATEWAY:5000/x:1")"
          refused 'tenant namespaces pull images only from registries on the internet' apply -f - \
            <<< "$(pod '' '' localhost:5000/x:1)"
          k -n zuul-trial create service clusterip ext --tcp=3128:3128 --dry-run=client -o json \
            | jq '.spec.externalIPs = ["172.31.250.2"]' > "$RUNNER_TEMP/svc-ext.json"
          refused 'tenant namespaces allow no Service with spec.externalIPs' apply -f - < "$RUNNER_TEMP/svc-ext.json"
          refused 'services.nodeports' create service nodeport np --tcp=80:80
          refused 'no-priority-class' apply -f - <<< "$(pod '"priorityClassName":"system-cluster-critical",' '')"
          # A plain pod is admitted, with the LimitRange's memory limit and NET_RAW dropped; a pod
          # that drops ALL keeps exactly that.
          got=$(k --as "$u" --as-group devinfra -n zuul-trial apply --dry-run=server -o json -f - <<< "$(pod '' '')" \
            | jq -c '.spec.containers[0] | [.resources.limits.memory, .securityContext.capabilities.drop]')
          echo "plain pod: $got"; [ "$got" = '["512Mi",["NET_RAW"]]' ]
          got=$(k --as "$u" --as-group devinfra -n zuul-trial apply --dry-run=server -o json \
                  -f - <<< "$(pod '' ',"securityContext":{"capabilities":{"drop":["ALL"]}}')" \
            | jq -c '.spec.containers[0].securityContext.capabilities.drop')
          echo "pod dropping ALL: $got"; [ "$got" = '["ALL"]' ]
          # Each container keeps its own drops and gains NET_RAW: an init container and two others.
          cat > "$RUNNER_TEMP/three.json" <<EOF
          {"apiVersion": "v1", "kind": "Pod", "metadata": {"name": "t"}, "spec": {
            "initContainers": [{"name": "i", "image": "$CURL_IMAGE"}],
            "containers": [
              {"name": "a", "image": "$CURL_IMAGE", "securityContext": {"capabilities": {"drop": ["CHOWN"]}}},
              {"name": "b", "image": "$CURL_IMAGE", "securityContext": {"capabilities": {"drop": ["ALL"]}}}]}}
          EOF
          got=$(k --as "$u" --as-group devinfra -n zuul-trial apply --dry-run=server -o json -f - \
                  < "$RUNNER_TEMP/three.json" \
            | jq -c '[.spec.initContainers[], .spec.containers[]]
                     | map({(.name): .securityContext.capabilities.drop}) | add')
          echo "drops: $got"; [ "$got" = '{"i":["NET_RAW"],"a":["CHOWN","NET_RAW"],"b":["ALL"]}' ]
          # Disk: the LimitRange's ephemeral-storage default and maximum, the quota's total, and a
          # pod that writes past its limit is evicted, into an emptyDir or into its own layer, while
          # one that stays within it runs on. Needs the kubelet's local storage isolation (on here).
          fmt='{.status.capacity.ephemeral-storage} capacity, {.status.allocatable.ephemeral-storage} allocatable'
          echo "node ephemeral-storage: $(k get node ci-node -o jsonpath="$fmt")"
          { k get --raw /api/v1/nodes/ci-node/proxy/configz \
              | jq -c '.kubeletconfig | {localStorageCapacityIsolation, evictionHard, volumeStatsAggPeriod}'; } \
            || echo "the kubelet's configz did not answer"
          got=$(k --as "$u" --as-group devinfra -n zuul-trial apply --dry-run=server -o json -f - <<< "$(pod '' '')" \
            | jq -c '.spec.containers[0].resources | [.requests["ephemeral-storage"], .limits["ephemeral-storage"]]')
          echo "plain pod's ephemeral-storage: $got"; [ "$got" = '["64Mi","512Mi"]' ]
          refused 'maximum ephemeral-storage usage per Container is 3Gi' apply -f - \
            <<< "$(pod '' ',"resources":{"limits":{"ephemeral-storage":"4Gi"}}')"
          two='"resources":{"limits":{"ephemeral-storage":"3Gi"}}'
          cat > "$RUNNER_TEMP/two.json" <<EOF
          {"apiVersion": "v1", "kind": "Pod", "metadata": {"name": "t"}, "spec": {"containers": [
            {"name": "a", "image": "$CURL_IMAGE", $two}, {"name": "b", "image": "$CURL_IMAGE", $two}]}}
          EOF
          refused 'exceeded quota: budget' apply -f - < "$RUNNER_TEMP/two.json"
          # writer <name> <dir> <MiB>: a pod with a 64Mi limit that writes <MiB> into <dir>, then
          # waits; /scratch is an emptyDir, anything else is in the container's own layer.
          writer() {
            jq -n --arg name "$1" --arg dir "$2" --arg mib "$3" --arg image "$BUSYBOX_IMAGE" '
              {apiVersion: "v1", kind: "Pod", metadata: {name: $name}, spec: {restartPolicy: "Never",
                containers: [{name: "w", image: $image,
                  command: ["sh", "-c", "dd if=/dev/zero of=\($dir)/fill bs=1M count=\($mib) && sleep 600"],
                  resources: {limits: {"ephemeral-storage": "64Mi"}}}]}}
              | if $dir == "/scratch" then .spec.volumes = [{name: "s", emptyDir: {}}]
                  | .spec.containers[0].volumeMounts = [{name: "s", mountPath: "/scratch"}] else . end' \
              | k --as "$u" --as-group devinfra -n zuul-trial apply -f -
          }
          writer fill-volume /scratch 200
          writer fill-layer /tmp 200
          writer within /scratch 16
          # The kubelet adds up emptyDir volumes about once a minute (its volume stats period).
          for p in fill-volume fill-layer; do
            k -n zuul-trial wait --for=jsonpath='{.status.reason}'=Evicted "pod/$p" --timeout=240s
            echo "$p: $(k -n zuul-trial get pod "$p" -o jsonpath='{.status.phase}: {.status.message}')"
          done
          phase=$(k -n zuul-trial get pod within -o jsonpath='{.status.phase}')
          echo "within: $phase"; [ "$phase" = Running ]
          k -n zuul-trial delete pod fill-volume fill-layer within --wait=false

          # A running pod's image cannot be changed to a refused one.
          k --as "$u" --as-group devinfra -n zuul-trial apply -f - <<< "$(pod '' ',"command":["sleep","600"]')"
          patch='[{"op":"replace","path":"/spec/containers/0/image",'
          patch+='"value":"registry-scratch.arc-scratch.svc:5000/x:1"}]'
          refused 'tenant namespaces pull images only from registries on the internet' \
            patch pod t --type=json -p "$patch"
          k -n zuul-trial delete pod t --wait=false

          # tenant-cert.sh refuses any other subject, and creates no CertificateSigningRequest for it.
          key=$RUNNER_TEMP/tenant.key
          openssl ecparam -name prime256v1 -genkey -noout -out "$key"
          before=$(k get csr --no-headers 2>/dev/null | wc -l)
          for subj in "/CN=$u/O=system:masters" "/CN=$u/OU=x/O=devinfra" "/CN=$u/O=devinfra/O=x" \
                      "/CN=t3c-artifex-prime/O=devinfra" "/CN=$u/CN=$u/O=devinfra"; do
            openssl req -new -key "$key" -subj "$subj" -out "$RUNNER_TEMP/bad.csr"
            if scripts/tenant-cert.sh "$u" "$RUNNER_TEMP/bad.csr" --out "$RUNNER_TEMP" 2> "$RUNNER_TEMP/out.txt"; then
              echo "tenant-cert.sh signed $subj" >&2; exit 1
            fi
            grep -q '^Refused' "$RUNNER_TEMP/out.txt" || { cat "$RUNNER_TEMP/out.txt" >&2; exit 1; }
            echo "$subj: $(grep '^Refused' "$RUNNER_TEMP/out.txt")"
          done
          openssl req -new -key "$key" -subj "/CN=$u/O=devinfra" -addext "subjectAltName=DNS:x" \
            -out "$RUNNER_TEMP/bad.csr"
          if scripts/tenant-cert.sh "$u" "$RUNNER_TEMP/bad.csr" --out "$RUNNER_TEMP"; then
            echo "tenant-cert.sh signed a request with a subject alternative name" >&2; exit 1
          fi
          [ "$(k get csr --no-headers 2>/dev/null | wc -l)" = "$before" ]

          # A real certificate and the kubeconfig the script writes, used by kubectl through the
          # forwarder from a container on another network. The credential plugin prints the
          # certificate and key from a file here; on a user's machine they come from a secret store.
          openssl req -new -key "$key" -subj "/CN=$u/O=devinfra" -out "$RUNNER_TEMP/tenant.csr"
          scripts/tenant-cert.sh "$u" "$RUNNER_TEMP/tenant.csr" --namespace zuul-trial --out "$RUNNER_TEMP"
          jq -n --rawfile cert "$RUNNER_TEMP/$u.crt" --rawfile key "$key" \
            '{apiVersion: "client.authentication.k8s.io/v1", kind: "ExecCredential",
              status: {clientCertificateData: $cert, clientKeyData: $key}}' > "$RUNNER_TEMP/credential.json"
          printf '#!/bin/sh\ncat /t/credential.json\n' > "$RUNNER_TEMP/tenant-credential"
          chmod +x "$RUNNER_TEMP/tenant-credential"
          docker network create tenants-test
          API_FORWARD_NETWORK=tenants-test docker compose -f api-forward.yml up -d --wait
          k3s_image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q k3s)")
          tk() {
            docker run --rm -u "$(id -u)" --network tenants-test -v "$RUNNER_TEMP:/t:ro" --entrypoint kubectl \
              "$k3s_image" --kubeconfig "/t/$u.kubeconfig" "$@"
          }
          tk get pods
          tk auth whoami
          for q in "-n arc-runners get pods" "get nodes" "get namespaces"; do
            # shellcheck disable=SC2086 # $q is the command's words
            if tk $q 2> "$RUNNER_TEMP/out.txt"; then echo "allowed: $q" >&2; exit 1; fi
            grep -q Forbidden "$RUNNER_TEMP/out.txt" || { cat "$RUNNER_TEMP/out.txt" >&2; exit 1; }
            echo "forbidden: $q"
          done
          # Without a certificate, nothing at all.
          yq '.clusters[0].cluster."certificate-authority-data"' "$RUNNER_TEMP/$u.kubeconfig" \
            | base64 -d > "$RUNNER_TEMP/ca.crt"
          for p in /version /api/v1/namespaces/zuul-trial/pods; do
            c=$(docker run --rm -u "$(id -u)" --network tenants-test -v "$RUNNER_TEMP:/t:ro" "$CURL_IMAGE" \
                  -sS -o /dev/null -w '%{http_code}' -m 10 --cacert /t/ca.crt \
                  --connect-to kubernetes:6443:k3s-api:6443 "https://kubernetes:6443$p" || true)
            echo "$p without a certificate: $c"; [ "$c" = 401 ]
          done

          # The NetworkPolicies, from a tenant pod. Servers: one in the same namespace, one in the
          # other tenant, one in default (no policies) behind a NodePort, and a port on the host.
          python3 -m http.server 18081 --bind 0.0.0.0 > /dev/null 2>&1 &
          serve() { k -n "$1" run "$2" --image="$BUSYBOX_IMAGE" --port=8080 --command -- httpd -f -p 8080; }
          serve zuul-trial same; serve build-farm other; serve default open
          k -n default expose pod open --type=NodePort --port=8080
          k -n zuul-trial run client --image="$CURL_IMAGE" --command -- sleep 600
          k -n default run control --image="$CURL_IMAGE" --command -- sleep 600
          for p in zuul-trial/same build-farm/other default/open zuul-trial/client default/control; do
            k -n "${p%/*}" wait --for=condition=Ready "pod/${p#*/}" --timeout=180s
          done
          ip() { k -n "$1" get pod "$2" -o jsonpath='{.status.podIP}'; }
          nodeport=$(k -n default get service open -o jsonpath='{.spec.ports[0].nodePort}')
          from() {
            k -n "$1" exec "$2" -- curl -ksS -o /dev/null -m 5 -w '%{http_code}' --noproxy '*' "$3" 2>/dev/null || true
          }
          # "answers" is any HTTP status; 000 is no connection.
          expect() {
            local c; c=$(from "$1" "$2" "$3"); echo "$1/$2 -> $3: $c (want $4)"
            if [ "$4" = answers ]; then [[ "$c" =~ ^[1-5][0-9]{2}$ ]]; else [ "$c" = "$4" ]; fi
          }
          expect zuul-trial client "http://$(ip zuul-trial same):8080/" answers
          expect zuul-trial client "http://$(ip default open):8080/" answers
          expect zuul-trial client "http://$(ip build-farm other):8080/" 000
          expect default control "http://$(ip zuul-trial same):8080/" 000
          # The controls show each address answers when a policy is not in the way.
          expect default control "http://172.31.250.10:$nodeport/" answers
          expect default control "http://10.42.0.1:$nodeport/" answers
          expect default control "http://$GATEWAY:18081/" answers
          expect default control "https://172.31.250.10:6443/" answers
          expect default control "https://172.31.250.11:6443/" answers
          expect default control "https://10.43.0.1:443/" answers
          # A NodePort reaches what its pod's own address does (here a pod with no policy).
          expect zuul-trial client "http://172.31.250.10:$nodeport/" answers
          expect zuul-trial client "http://$GATEWAY:18081/" 000
          expect zuul-trial client "https://172.31.250.10:6443/" 000
          expect zuul-trial client "https://10.43.0.1:443/" 000
          expect zuul-trial client "https://172.31.250.11:6443/" 000
          c=$(k -n zuul-trial exec client -- curl -sS -o /dev/null -m 15 -w '%{http_code}' -x "$PROXY" \
                https://github.com/ || true)
          echo "github.com through the proxy from the tenant pod: $c"; [ "$c" = 200 ]
          k -n zuul-trial delete pod same client --wait=false
          k -n build-farm delete pod other --wait=false
          k -n default delete pod open control --wait=false
          k -n default delete service open
          docker compose -p ci-api down

      - name: The proxy saw the pulls
        run: |
          docker compose exec -T -u proxy proxy \
            grep -cE 'CONNECT (registry-1.docker.io|ghcr.io)' /var/log/squid/access.log

      - name: The proxy's health check rotates its access log
        run: |
          set -euo pipefail
          log=/var/log/squid/access.log
          # The health check's own command, as docker-compose.yml defines it.
          check=$(docker inspect --format '{{index .Config.Healthcheck.Test 1}}' "$(docker compose ps -q proxy)")
          docker compose exec -T -u proxy proxy sh -c "yes 'padding past the rotation size' | head -c 11000000 >> $log"
          docker compose exec -T proxy sh -c "$check"
          # The rotation is a signal to Squid: wait until it has renamed the log and opened a new one.
          for _ in $(seq 1 10); do
            docker compose exec -T proxy test -e "$log.0" && docker compose exec -T proxy test -e "$log" && break
            sleep 1
          done
          old=$(docker compose exec -T proxy stat -c %s "$log.0")
          new=$(docker compose exec -T proxy stat -c %s "$log")
          echo "after the check: access.log.0 $old bytes, access.log $new bytes"
          [ "$old" -gt 10485760 ] && [ "$new" -lt 1048576 ]
          docker compose exec -T proxy squid -k check

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a || true
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -aq proxy)" || true
          docker compose logs --tail 200 k3s || true
          docker compose exec -T k3s kubectl get pods -A -o wide || true
          docker compose exec -T k3s kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          docker compose exec -T k3s kubectl -n arc-systems describe pods || true
          docker compose exec -T -u proxy proxy tail -n 60 /var/log/squid/access.log || true

      - name: Tear down
        if: always()
        run: |
          docker compose down -v --timeout 30 || true
          sudo rm -rf kubeconfig "$RUNNER_TEMP/ci-cache" .env
