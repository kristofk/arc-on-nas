name: Images

# Builds the runner images in images/ and pushes them to the GitHub Container Registry of the
# repository's owner: ghcr.io/<owner>/arc-runner-swift and ghcr.io/<owner>/arc-runner-ubuntu.
# Runs when a tag v* is pushed, or by hand: `gh workflow run Images --ref <branch or tag>`.
#
# Each image is tagged with the versions it contains (Swift and runner, or runner only) and with
# the commit. Tags move; the digest does not. The job summary prints image@digest: put that in
# helm/swift.yaml or helm/ubuntu.yaml.
#
# A package pushed from a private repository is private: make it public in the package's
# settings, or give the cluster a pull secret (README, "Building the images").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [swift, ubuntu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions in the Dockerfile
        id: versions
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          file="images/$IMAGE/Dockerfile"
          runner=$(sed -n 's|^FROM ghcr.io/actions/actions-runner:\([0-9.]*\)@.*|\1|p' "$file")
          test -n "$runner"
          if [ "$IMAGE" = swift ]; then
            swift=$(sed -n 's|^ARG SWIFT_VERSION=\(.*\)$|\1|p' "$file")
            test -n "$swift"
            tag="$swift-$runner"
          else
            tag="$runner"
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/arc-runner-$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.versions.outputs.name }}
          tags: |
            type=raw,value=${{ steps.versions.outputs.tag }}
            type=sha,prefix=${{ steps.versions.outputs.tag }}-
          labels: |
            org.opencontainers.image.title=arc-runner-${{ matrix.image }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: images/${{ matrix.image }}
          # The Swift tarball in images/swift is for x86_64; add linux/arm64 to the ubuntu image if
          # your host needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Print the digest to pin
        env:
          NAME: ${{ steps.versions.outputs.name }}
          TAG: ${{ steps.versions.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "Pin: $NAME:$TAG@$DIGEST"
          {
            echo "### arc-runner-$IMAGE"
            echo
            echo "Pin this in helm/$IMAGE.yaml:"
            echo
            echo '```'
            echo "$NAME:$TAG@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
