name: Images

# Builds the runner images in images/ and pushes them to the GitHub Container Registry of the
# repository's owner: ghcr.io/<owner>/arc-runner-swift and ghcr.io/<owner>/arc-runner-ubuntu.
# Pull requests and branch dispatches build and test without publishing. A tag v* or a manual
# dispatch on main publishes after runtime checks: `gh workflow run Images --ref main`.
#
# Each image is tagged with its runner and Node versions (plus Swift and Ubuntu for swift) and with
# the commit. Tags move; the digest does not. The job summary prints image@digest: put that in
# helm/swift.yaml or helm/ubuntu.yaml.
#
# A package pushed from a private repository is private: make it public in the package's
# settings, or give the cluster a pull secret (README, "Building the images").
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [swift, ubuntu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions in the Dockerfile
        id: versions
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          file="images/$IMAGE/Dockerfile"
          runner=$(sed -n 's|^FROM ghcr.io/actions/actions-runner:\([0-9.]*\)@.*|\1|p' "$file")
          test -n "$runner"
          node=$(sed -n 's/^ARG NODE_VERSION=//p' "$file")
          test -n "$node"
          if [ "$IMAGE" = swift ]; then
            swift=$(sed -n 's|^ARG SWIFT_VERSION=\(.*\)$|\1|p' "$file")
            test -n "$swift"
            tag="$swift-$runner-ubuntu26.04-node$node"
          else
            tag="$runner-node$node"
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/arc-runner-$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.versions.outputs.name }}
          tags: |
            type=raw,value=${{ steps.versions.outputs.tag }}
            type=sha,prefix=${{ steps.versions.outputs.tag }}-
          labels: |
            org.opencontainers.image.title=arc-runner-${{ matrix.image }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: images/${{ matrix.image }}
          # All bundled tarballs are x86_64. Other architectures need matching downloads and pins.
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Runner and tools as uid 1001
        env:
          IMAGE: ${{ matrix.image }}
          REF: ${{ steps.versions.outputs.name }}:${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/check-image.sh "$IMAGE" "$REF" | tee "versions-$IMAGE.txt"
          {
            echo "### $IMAGE runtime checks (uid 1001)"
            echo '```text'
            cat "versions-$IMAGE.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: publish
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ steps.versions.outputs.name }}:${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do docker push "$tag"; done <<< "$TAGS"
          pin=$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}')
          echo "digest=${pin#*@}" >> "$GITHUB_OUTPUT"

      - name: Print the digest to pin
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          NAME: ${{ steps.versions.outputs.name }}
          TAG: ${{ steps.versions.outputs.tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "Pin: $NAME:$TAG@$DIGEST"
          {
            echo "### arc-runner-$IMAGE"
            echo
            echo "Pin this in helm/$IMAGE.yaml:"
            echo
            echo '```'
            echo "$NAME:$TAG@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
