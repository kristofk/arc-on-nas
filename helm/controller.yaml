# Values for the gha-runner-scale-set-controller chart, version 0.15.0, release "arc" in
# namespace arc-systems. Chart defaults:
# https://github.com/actions/actions-runner-controller/blob/gha-runner-scale-set-0.15.0/charts/gha-runner-scale-set-controller/values.yaml
#
#   docker compose run --rm helm upgrade --install arc \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
#     --version 0.15.0 --namespace arc-systems -f helm/controller.yaml
#
# The controller needs no GitHub credential of its own and no proxy setting here: it reaches
# GitHub with each scale set's credential and proxy (helm/swift.yaml, helm/ubuntu.yaml).

replicaCount: 1

flags:
  logLevel: info
  logFormat: text

# Restricted-compliant (manifests/namespaces.yaml). The image runs as uid 65532.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Requests equal limits: the pod is in the Guaranteed QoS class and its admission is exact.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 256Mi
