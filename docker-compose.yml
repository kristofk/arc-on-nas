# arc-on-nas: GitHub Actions runners on a single-node k3s cluster inside Docker.
#
#   k3s    one Kubernetes node (control plane and kubelet in one container). Runs the
#          actions-runner-controller and the ephemeral runner pods.
#   proxy  Squid, the cluster's only way to the internet: HTTP and HTTPS to public addresses only.
#   helm   a one-shot Helm client for installing the charts (profile "admin"; never running).
#
# Read README.md before the first `up`: preflight.sh, the directories and .env come first.
# Every value that differs between hosts is in .env (see .env.example); this file is the same
# everywhere.
#
# Addresses on the stack network are fixed because pods cannot resolve Docker's container names.
# If 172.31.250.0/24 collides with something on your host, change it here and in squid.conf,
# manifests/networkpolicy-runners.yaml and helm/*.yaml; scripts/check-consistency.sh checks that
# they agree.

name: ci

services:

  k3s:
    image: rancher/k3s:v1.36.5-k3s1@sha256:057cfd5a9d51b89f1f0ee139c28d5d5fdd5aa7ddeac2742a0ba90c6dbc0329bb
    # One server, no agents, so no K3S_TOKEN: k3s generates its own and only agents would use it.
    command: >-
      server
      --node-name=ci-node
      --node-ip=172.31.250.10
      --disable=traefik,servicelb
      --disable-helm-controller
      --snapshotter=${K3S_SNAPSHOTTER:-overlayfs}
      --kubelet-arg=system-reserved=${K3S_SYSTEM_RESERVED:?set K3S_SYSTEM_RESERVED in .env}
      --kubelet-arg=kube-reserved=${K3S_KUBE_RESERVED:?set K3S_KUBE_RESERVED in .env}
      --kube-proxy-arg=conntrack-max-per-core=0
      --write-kubeconfig-mode=600
      ${K3S_EXTRA_ARGS:-}
    # --node-ip: k3s otherwise picks the interface of the default route, and the internal network
    #   has none ("no default routes found"). Must match ipv4_address below.
    # --disable=traefik,servicelb: nothing here is served to the network; both would only use memory.
    # --disable-helm-controller: charts are installed with the `helm` service below, not by k3s.
    # --kube-proxy-arg=conntrack-max-per-core=0: kube-proxy would otherwise raise the host's
    #   nf_conntrack_max, a host-wide setting, from inside the container.
    # --kubelet-arg=*-reserved: the kubelet sees the whole host, not this container's caps; the
    #   reservations shrink what it admits to fit inside them (README, "Sizing").

    # Required. A Kubernetes node mounts filesystems, manages cgroups and programs iptables, and
    # neither k3s nor kind has a tested smaller set of capabilities. This makes the container
    # equivalent to root on the host: README, "Security posture".
    privileged: true
    # The node gets its own cgroup subtree; the kubelet creates the pods' cgroups inside it, so the
    # caps below bound every pod together.
    cgroup: private
    # If the Docker daemon remaps user namespaces, a privileged container must opt out of it.
    userns_mode: host
    hostname: ci-node
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      # Watchtower, if you run it, must not update this container: updates are deliberate.
      - com.centurylinklabs.watchtower.enable=false
    # As in k3s's own docker-compose.yml: /run and /var/run must be tmpfs for containerd.
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    cpus: ${K3S_CPUS:-10}
    mem_limit: ${K3S_MEMORY:-17g}
    # No swap for the cluster: memory.swap.max equal to the limit means none.
    memswap_limit: ${K3S_MEMORY:-17g}
    cpu_shares: ${K3S_CPU_SHARES:-256}
    pids_limit: ${K3S_PIDS_LIMIT:-32768}
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "600"
      # For `docker compose exec k3s kubectl ...`.
      KUBECONFIG: /output/kubeconfig.yaml
      # containerd's image pulls and k3s's own downloads go through the proxy; k3s passes these to
      # containerd and the kubelet, never to pods. k3s adds the pod and service ranges itself.
      HTTP_PROXY: http://172.31.250.2:3128
      HTTPS_PROXY: http://172.31.250.2:3128
      NO_PROXY: localhost,127.0.0.1,::1,172.31.250.0/24,10.42.0.0/16,10.43.0.0/16,.svc,.cluster.local
    volumes:
      # Named volumes, so `docker compose down` keeps the cluster and containerd's snapshots are not
      # on the container's own overlay filesystem (overlayfs cannot be nested on overlayfs).
      - k3s-data:/var/lib/rancher/k3s
      - k3s-kubelet:/var/lib/kubelet
      - k3s-cni:/var/lib/cni
      - k3s-log:/var/log
      # The node's identity (/etc/rancher/node/password); without it a recreated container is
      # refused as a different node with the same name.
      - k3s-config:/etc/rancher
      # The cluster-admin kubeconfig, written by k3s with mode 600. Create the directory root-owned
      # with mode 700 before the first `up` (README, "Quick start").
      - ./kubeconfig:/output
      # This repository's manifests, for `kubectl apply -k /opt/arc-on-nas/manifests`.
      - ./manifests:/opt/arc-on-nas/manifests:ro
      # The warm build cache; the PersistentVolume in manifests/cache.yaml points here.
      - ${CACHE_DIR:?set CACHE_DIR in .env}:/var/lib/ci-cache
    healthcheck:
      # The API server answers; the node's Ready condition is checked separately (README).
      test: ["CMD", "kubectl", "get", "--raw=/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      - proxy
    networks:
      runners:
        ipv4_address: 172.31.250.10

  proxy:
    # Squid 6 on Ubuntu 24.04, pinned by digest.
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    configs:
      - source: squid-conf
        target: /etc/squid/squid.conf
    # Squid starts as root and drops to its own user; it needs nothing else.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 256
    networks:
      runners:
        ipv4_address: 172.31.250.2
      egress: {}

  helm:
    # Run on demand: `docker compose run --rm helm <helm arguments>` (README, "Quick start").
    image: alpine/helm:3.22.0@sha256:70ed3f7b02ab2eee12aa520ad6870305db8a82516b07aff62f5656c657a26e2a
    profiles:
      - admin
    # Shares the node's network namespace: the kubeconfig's https://127.0.0.1:6443 is the API
    # server, and the internet (the charts on ghcr.io) is reachable only through the proxy.
    network_mode: service:k3s
    environment:
      KUBECONFIG: /kubeconfig/kubeconfig.yaml
      HTTP_PROXY: http://172.31.250.2:3128
      HTTPS_PROXY: http://172.31.250.2:3128
      NO_PROXY: localhost,127.0.0.1,::1
    volumes:
      - ./kubeconfig:/kubeconfig:ro
      - ./helm:/work/helm:ro
    working_dir: /work
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

configs:
  squid-conf:
    file: ./squid.conf

networks:
  # The node and the proxy. internal: Docker gives it no route out, so the proxy is the only way
  # to the internet. The host can still reach the containers, and they can reach the host's own
  # ports through the gateway address (README, "Security posture").
  runners:
    internal: true
    enable_ipv6: false
    driver_opts:
      # A fixed interface name (at most 15 characters), for a host firewall rule if you add one.
      com.docker.network.bridge.name: br-ci-runners
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
  # The proxy's way out. Nothing else joins it.
  egress:
    enable_ipv6: false

volumes:
  k3s-data: {}
  k3s-kubelet: {}
  k3s-cni: {}
  k3s-log: {}
  k3s-config: {}
